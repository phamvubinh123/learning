      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('certstudio:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
